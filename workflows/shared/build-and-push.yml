name: Build and Push Container

on:
  workflow_call:
    inputs:
      runner-label:
        description: 'Self-hosted runner label (must match ARC scale set name)'
        required: true
        type: string
      image-name:
        description: 'Image name (e.g. scrape-engine)'
        required: true
        type: string
      context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Dockerfile path'
        required: false
        type: string
        default: './Dockerfile'
      registry:
        description: 'Container registry (use IP for DinD compatibility)'
        required: false
        type: string
        default: '192.168.4.103:5000'
      language:
        description: 'Project language: node, go, python, auto, or comma-separated (e.g. go,node)'
        required: false
        type: string
        default: 'auto'
      audit-level:
        description: 'Security audit severity threshold'
        required: false
        type: string
        default: 'high'
      skip-audit:
        description: 'Skip security audit'
        required: false
        type: boolean
        default: false
      node-working-directory:
        description: 'Working directory for Node.js audit (e.g. web/ for monorepos)'
        required: false
        type: string
        default: '.'

jobs:
  audit:
    if: ${{ !inputs.skip-audit }}
    uses: ./.github/workflows/security-audit.yml
    with:
      runner-label: ${{ inputs.runner-label }}
      language: ${{ inputs.language }}
      audit-level: ${{ inputs.audit-level }}
      node-working-directory: ${{ inputs.node-working-directory }}

  build:
    needs: [audit]
    if: always() && (needs.audit.result == 'success' || needs.audit.result == 'skipped')
    runs-on: ${{ inputs.runner-label }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t ${{ inputs.registry }}/${{ inputs.image-name }}:latest \
            -t ${{ inputs.registry }}/${{ inputs.image-name }}:${{ github.sha }} \
            -f ${{ inputs.dockerfile }} \
            ${{ inputs.context }}

      - name: Push image
        run: |
          docker push ${{ inputs.registry }}/${{ inputs.image-name }}:latest
          docker push ${{ inputs.registry }}/${{ inputs.image-name }}:${{ github.sha }}

      - name: Summary
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ inputs.registry }}/${{ inputs.image-name }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Audit | ${{ needs.audit.result }} |" >> $GITHUB_STEP_SUMMARY
