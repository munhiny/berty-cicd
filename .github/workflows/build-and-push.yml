name: Build and Push Container

on:
  workflow_call:
    inputs:
      runner-label:
        description: 'Self-hosted runner label (must match ARC scale set name)'
        required: true
        type: string
      image-name:
        description: 'Image name (e.g. my-app)'
        required: true
        type: string
      context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Dockerfile path'
        required: false
        type: string
        default: './Dockerfile'
      registry:
        description: 'Container registry (use IP for DinD compatibility)'
        required: false
        type: string
        default: 'localhost:5000'
      language:
        description: 'Comma-separated languages: node, go, python, or auto'
        required: false
        type: string
        default: 'auto'
      audit-level:
        description: 'Security audit severity threshold'
        required: false
        type: string
        default: 'high'
      platforms:
        description: >
          Comma-separated target platforms (e.g. linux/amd64,linux/arm64).
          Empty (default) keeps the plain single-arch docker build. Set it
          when the image must also run on the arm64 control-plane nodes.
        required: false
        type: string
        default: ''
      skip-audit:
        description: 'Skip security audit'
        required: false
        type: boolean
        default: false
      node-working-directory:
        description: 'Working directory for Node.js (e.g. web/ for monorepos)'
        required: false
        type: string
        default: '.'
      go-working-directory:
        description: 'Working directory for Go (e.g. broker/ for multi-image repos)'
        required: false
        type: string
        default: '.'

jobs:
  audit:
    if: ${{ !inputs.skip-audit }}
    runs-on: ${{ inputs.runner-label }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect languages
        id: detect
        run: |
          LANGS="${{ inputs.language }}"
          if [ "$LANGS" = "auto" ]; then
            LANGS=""
            [ -f package.json ] || [ -f "${{ inputs.node-working-directory }}/package.json" ] && LANGS="${LANGS},node"
            [ -f go.mod ] || [ -f "${{ inputs.go-working-directory }}/go.mod" ] && LANGS="${LANGS},go"
            [ -f uv.lock ] || [ -f pyproject.toml ] || [ -f requirements.txt ] && LANGS="${LANGS},python"
            LANGS="${LANGS#,}"
          fi
          echo "langs=$LANGS" >> "$GITHUB_OUTPUT"
          echo "Detected languages: $LANGS"

      # --- Node.js ---
      - uses: actions/setup-node@v4
        if: contains(steps.detect.outputs.langs, 'node')
        with:
          node-version: '22'

      - name: Node — install dependencies
        if: contains(steps.detect.outputs.langs, 'node')
        working-directory: ${{ inputs.node-working-directory }}
        run: npm ci --ignore-scripts

      - name: Node — npm audit
        if: contains(steps.detect.outputs.langs, 'node')
        working-directory: ${{ inputs.node-working-directory }}
        run: npm audit --audit-level=${{ inputs.audit-level }} || true

      - name: Node — lint
        if: contains(steps.detect.outputs.langs, 'node')
        working-directory: ${{ inputs.node-working-directory }}
        run: |
          if grep -q '"lint"' package.json 2>/dev/null; then
            npm run lint
          else
            echo "No lint script, skipping"
          fi

      # --- Go ---
      - uses: actions/setup-go@v5
        if: contains(steps.detect.outputs.langs, 'go')
        with:
          go-version-file: ${{ inputs.go-working-directory }}/go.mod

      - name: Go — govulncheck
        if: contains(steps.detect.outputs.langs, 'go')
        working-directory: ${{ inputs.go-working-directory }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

      - name: Go — verify modules
        if: contains(steps.detect.outputs.langs, 'go')
        working-directory: ${{ inputs.go-working-directory }}
        run: |
          go mod verify
          go mod tidy -diff 2>&1 || echo "::warning::go.mod/go.sum not tidy"

      - name: Go — test
        if: contains(steps.detect.outputs.langs, 'go')
        working-directory: ${{ inputs.go-working-directory }}
        run: |
          # Build frontend first if it exists (needed for go:embed)
          if [ -f "${{ inputs.node-working-directory }}/package.json" ] && [ "${{ inputs.node-working-directory }}" != "." ]; then
            cd "${{ inputs.node-working-directory }}" && npm ci && npm run build && cd ..
          fi
          go test ./...

      # --- Python ---
      - name: Python — install uv
        if: contains(steps.detect.outputs.langs, 'python')
        uses: astral-sh/setup-uv@v4

      - name: Python — install deps
        if: contains(steps.detect.outputs.langs, 'python')
        run: |
          if [ -f uv.lock ]; then
            uv sync --frozen --group dev
          elif [ -f pyproject.toml ]; then
            uv sync --group dev
          elif [ -f requirements.txt ]; then
            uv venv && uv pip install -r requirements.txt
          fi

      - name: Python — ruff lint + format
        if: contains(steps.detect.outputs.langs, 'python')
        run: |
          uv run ruff check . || true
          uv run ruff format --check . || true

      - name: Python — pytest
        if: contains(steps.detect.outputs.langs, 'python')
        run: |
          if uv run python -c "import pytest" 2>/dev/null; then
            uv run pytest
          fi

      - name: Python — pip-audit
        if: contains(steps.detect.outputs.langs, 'python')
        run: |
          uv tool install pip-audit
          pip-audit || true

  build:
    needs: [audit]
    if: always() && (needs.audit.result == 'success' || needs.audit.result == 'skipped')
    runs-on: ${{ inputs.runner-label }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        if: inputs.platforms == ''
        run: |
          docker build \
            -t ${{ inputs.registry }}/${{ inputs.image-name }}:latest \
            -t ${{ inputs.registry }}/${{ inputs.image-name }}:${{ github.sha }} \
            -f ${{ inputs.dockerfile }} \
            ${{ inputs.context }}

      - name: Push image
        if: inputs.platforms == ''
        run: |
          docker push ${{ inputs.registry }}/${{ inputs.image-name }}:latest
          docker push ${{ inputs.registry }}/${{ inputs.image-name }}:${{ github.sha }}

      # NOTE: no QEMU setup. The Talos runner kernel has no binfmt_misc,
      # so emulation cannot register ("no such device"). Multi-arch
      # callers must use emulation-free Dockerfiles: builder stages pinned
      # to $BUILDPLATFORM, final stages COPY-only for foreign arches.
      - name: Set up Buildx
        if: inputs.platforms != ''
        uses: docker/setup-buildx-action@v3
        with:
          # The cluster registry is plain HTTP; buildx pushes directly from
          # buildkitd, which needs its own insecure-registry marking.
          buildkitd-config-inline: |
            [registry."${{ inputs.registry }}"]
              http = true

      - name: Build and push image (multi-arch)
        if: inputs.platforms != ''
        run: |
          docker buildx build \
            --platform ${{ inputs.platforms }} \
            -t ${{ inputs.registry }}/${{ inputs.image-name }}:latest \
            -t ${{ inputs.registry }}/${{ inputs.image-name }}:${{ github.sha }} \
            -f ${{ inputs.dockerfile }} \
            --push \
            ${{ inputs.context }}

      - name: Summary
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ inputs.registry }}/${{ inputs.image-name }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Audit | ${{ needs.audit.result }} |" >> $GITHUB_STEP_SUMMARY
