name: Build and Push Container

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Image name (e.g. scrape-engine)'
        required: true
        type: string
      context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Dockerfile path'
        required: false
        type: string
        default: './Dockerfile'
      registry:
        description: 'Container registry'
        required: false
        type: string
        default: 'registry.local:5000'
      language:
        description: 'Project language for security audit: node, go, python, or auto'
        required: false
        type: string
        default: 'auto'
      audit-level:
        description: 'Security audit severity threshold'
        required: false
        type: string
        default: 'high'
      skip-audit:
        description: 'Skip security audit'
        required: false
        type: boolean
        default: false
      platforms:
        description: 'Target platforms (e.g. linux/amd64,linux/arm64)'
        required: false
        type: string
        default: 'linux/amd64'

jobs:
  audit:
    if: ${{ !inputs.skip-audit }}
    uses: ./.github/workflows/security-audit.yml
    with:
      language: ${{ inputs.language }}
      audit-level: ${{ inputs.audit-level }}

  build:
    needs: [audit]
    if: always() && (needs.audit.result == 'success' || needs.audit.result == 'skipped')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --platform ${{ inputs.platforms }} \
            -t ${{ inputs.registry }}/${{ inputs.image-name }}:latest \
            -t ${{ inputs.registry }}/${{ inputs.image-name }}:${{ github.sha }} \
            -f ${{ inputs.dockerfile }} \
            ${{ inputs.context }}

      - name: Push image
        run: |
          docker push ${{ inputs.registry }}/${{ inputs.image-name }}:latest
          docker push ${{ inputs.registry }}/${{ inputs.image-name }}:${{ github.sha }}

      - name: Trigger Flux reconciliation
        run: |
          flux reconcile source git flux-system || echo "Flux reconcile skipped"

      - name: Summary
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ inputs.registry }}/${{ inputs.image-name }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | \`${{ inputs.platforms }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Audit | ${{ needs.audit.result }} |" >> $GITHUB_STEP_SUMMARY
