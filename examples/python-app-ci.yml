# Example: Python app CI (using uv)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: <owner>/cicd/.github/workflows/build-and-push.yml@main
    with:
      runner-label: arc-runner-my-python-app
      image-name: my-python-app
      language: python
      audit-level: high

  vuln-check:
    uses: munhiny/berty-cicd/.github/workflows/vuln-check.yml@main
    with:
      runner-label: arc-runner-my-app
