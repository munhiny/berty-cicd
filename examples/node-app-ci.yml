# Example: Node.js app CI
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: <owner>/cicd/.github/workflows/build-and-push.yml@main
    with:
      runner-label: arc-runner-my-node-app
      image-name: my-node-app
      language: node
      audit-level: high
